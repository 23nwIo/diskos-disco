/* a song of your own onto the card: into the library, not the queue (Jo) - you add it like any other */
var UPX='mp3 flac m4a ogg opus oga wav aif aiff ape wma aac dsf dff dts'.split(' ');   /* RMT_UPLOAD_EXTS (remote_core.h) */function upick(){shut();$('uf').accept=UPX.map(function(e){return'.'+e}).join(',');$('uf').value='';$('uf').click()}

var x=new XMLHttpRequest();x.open('POST','api/upload?'+who()+'&f='+encodeURIComponent(f.name));
x.upload.onprogress=function(v){if(v.lengthComputable)say('Uploading… '+Math.floor(v.loaded*100/v.total)+' %')};
x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(e){}if(!j.ok){say(j.message||'The upload didn\u2019t work');return}
say('');sheet('Uploaded: '+(j.title||f.name),[['Add to the queue',function(){qadd({id:j.song_id})}]])};
x.onerror=function(){say('The upload broke off - try again')};say('Uploading… 0 %');x.send(f)};
$('upb').onclick=upick;
function rfav(x,b){var on=!isr(x);if(on)FR.unshift({name:x.name,url:x.url,codec:x.codec||'',bitrate:x.bitrate||0,country:x.country||''});else FR=FR.filter(function(f){return f.url!==x.url});
try{localStorage.setItem('pr',JSON.stringify(FR))}catch(e){say('This browser can\u2019t keep favourites');return}sendst();if(b)star(b,on);say(on?'Saved to your stations':'Removed from your stations',1);if(cur().l==='radio')load(0)}
function rplay(x,now){pc('radio',enc({name:x.name,url:x.url,now:now?1:0})).then(function(j){if(j.ok)say(now?'Playing '+x.name:x.name+' plays when the queue is empty',1)})}
function station(x){return[x.name,[x.codec,x.bitrate?x.bitrate+' kbps':'',x.country].filter(Boolean).join(' · '),function(){var a=[];
if(P&&P.radio_now)a.push(['Play now',function(){rplay(x,1)}]);if(P&&P.radio_end)a.push(['Play when the queue is empty',function(){rplay(x,0)}]);
a.push([isr(x)?'Remove from your stations':'Save to your stations',function(){rfav(x)}]);sheet(x.name+(P&&P.radio?'':' (the host picks what plays)'),a)},
{f:isr(x),fn:function(b){rfav(x,b)}},x.url]}
var ROOT={albums:['Albums',function(x){return[x.name,x.artist+' · '+x.count,function(){open('album',{name:x.name},x.name,song)}]}],
artists:['Artists',function(x){return[x.name,'',function(){open('artist',{name:x.name},x.name,song)}]}],songs:['Songs',song,{},null,function(){return P&&P.upload?[['Upload a song…',upick]]:[]}],
playlists:['Playlists',function(x){return[x.name,'',function(){open('playlist',{id:x.id},x.name,song)}]}],favorites:['Favourites',song],folder:['Folders',frow(''),{path:''}],radio:['Your stations',station,{},['Find stations',function(){open('radio_search',{},'Find stations',station)}],
function(){return[['Add a stream URL…',function(){askurl(function(n,u){if(isr({url:u})){say('Already in your stations');return}rfav({name:n,url:u})})}]]}]};
function open(l,p,t,row,act,menu){st.push({l:l,p:p,t:t,row:row,act:act,menu:menu});$('q').value='';load(0)}
function cur(){return st[st.length-1]}

$('ti').textContent=v.t;$('bk').style.visibility=st.length>1?'visible':'hidden';if(!off){items=[];$('list').textContent='Loading…'}
$('pa').classList.toggle('hide',!v.act);$('hm').classList.toggle('hide',!(v.menu&&v.menu().length));if(v.act)$('pa').textContent=v.act[0];
$('q').placeholder=v.l==='radio_search'?'Search all stations':'Search';if(v.l==='radio_search'){rsearch(v);return}
var L=v.l==='favorites'?FV:v.l==='radio'?FR:null;
(L?Promise.resolve({ok:true,items:L.filter(function(f){return rmt([f.title,f.artist,f.album,f.name,f.country].join(' '),$('q').value)})}):get('api/library/'+v.l+'?'+enc(p))).then(function(j){if(L)j.total=j.items.length;if(v!==cur())return;if(!j.ok){$('list').textContent='';say(j.message||'Not possible right now');return}

if(!tot)$('list').textContent=$('q').value?'No matches':v.l==='favorites'?'No favourites yet - add songs from their menu':v.l==='radio'?'No stations yet - press Find stations':'Empty';$('mo').classList.toggle('hide',items.length>=tot)}).catch(function(){say('Player not reachable')})}

if(r[3]&&r[3].fn){var w=document.createElement('div');w.className='rw';w.appendChild(b);var f=document.createElement('button');f.className='st';star(f,r[3].f);f.onclick=function(){r[3].fn(f)};w.appendChild(f);b=w}$('list').appendChild(b)}

pc('radio_search',enc({q:$('q').value})).then(function(j){if(j.ok)rpoll(v,g,0);else if(v===cur()&&g===v.gen)$('list').textContent=''})}
