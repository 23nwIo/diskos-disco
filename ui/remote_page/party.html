<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>
<meta name=referrer content=no-referrer><title>Party</title>
<style>
@@STYLE@@
</style><main><div class=top><h1>Party</h1><small id=left class=hint></small></div>
<div class=seg id=tabs><button data-v=np id=npt class=on>Now playing</button><button data-v=q id=qt>Queue</button><button data-v=songs>Songs</button><button data-v=albums>Albums</button><button data-v=artists>Artists</button><button data-v=playlists>Playlists</button><button data-v=favorites>Favourites</button><button data-v=folder>Folders</button><button data-v=radio id=rat class=hide>Radio</button><button data-v=me>You</button></div>
<div id=np><div class=card><img id=cv class=hide alt=''><div id=t>-</div><div id=a></div><div id=al></div><div id=by class=hint></div>
<div id=pw><input id=pos type=range min=0 max=1 value=0 disabled aria-label=Position><div class=row><span id=pc>0:00</span><span id=du>0:00</span></div></div></div>
<div class=tr id=sk><button id=nx aria-label='Skip this song'>&#9197;</button></div>
<div class='card hide' id=vw><label for=vol>Volume <span id=vv></span></label><input id=vol type=range min=0 max=100 value=0></div></div>
<div id=qv class=hide><div id=ql>Loading…</div></div>
<div id=lib class=hide><input id=q type=search placeholder=Search aria-label=Search>
<div class=hd><button id=bk aria-label=Back>&#8249;</button><b id=ti></b></div>
<div id=list></div><button id=mo class='more hide'>Load more</button></div>
<div id=me class='card hide blk'><div id=nmw><label for=nm>Your name (shown with your songs)</label><input id=nm maxlength=24 autocomplete=nickname></div>
<label for=lka>Page colour</label><select id=lka><option value=orange>Orange<option value=blue>Blue<option value=green>Green<option value=purple>Purple<option value=red>Red</select>
<label for=lkf>Your songs are marked with</label><select id=lkf><option value=heart>Hearts (red)<option value=star>Stars (yellow)</select>
<div id=rules class=hint></div></div>
<div id=shb class=hide></div><div id=sh class=hide></div>
<div id=msg></div></main>
<script>
@@COMMON@@
/* the guests' page: who you are is a random id this browser keeps (a private window is a new guest) */
var GID='',NM='',P=null,V='np',st=[],items=[],tot=0,art='',drag=0,busy=0,qver=-1;
try{GID=localStorage.getItem('pg')||'';NM=localStorage.getItem('pn')||''}catch(e){}
if(!/^[A-Za-z0-9]{16}$/.test(GID)){var A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r=new Uint8Array(16);crypto.getRandomValues(r);GID='';r.forEach(function(x){GID+=A[x%A.length]});try{localStorage.setItem('pg',GID)}catch(e){}}
function who(){return'g='+GID+(NM&&P&&P.names?'&n='+encodeURIComponent(NM):'')}
function pc(c,b){return cmdj(c,who()+(b?'&'+b:''))}
function get(u){return fetch(u+(u.indexOf('?')<0?'?':'&')+who(),{cache:'no-store'}).then(function(r){return r.json()})}
function mark(on){return on?'<span style=color:var(--fav)>'+(LK.fav==='star'?'&#9733;':'&#9829;')+'</span> ':''}
function rules(p){var t=['You can have '+p.total+(p.total>1?' songs':' song')+' in the queue at a time; a place frees up once one plays.'];
if(p.consec>=1)t.push(p.consec>1?'At most '+p.consec+' of your songs play in a row.':'Your songs never play twice in a row - guests take turns.');
if(p.radio)t.push('A station you pick in Radio plays when the queue is empty.');if(!p.repeat)t.push('A song that is already queued can’t be added again.');return t.join(' ')}
function poll(){if(document.hidden||busy)return;busy=1;get('api/state').then(function(s){busy=0;if(!s.ok){say(s.message||'Not possible right now');return}
var p=P=s.party;$('left').textContent=p.left?p.left+(p.left>1?' songs':' song')+' left to add':'Your songs are queued';$('rules').textContent=rules(p);
$('npt').classList.toggle('hide',!p.np&&!p.vol&&!p.skip);$('rat').classList.toggle('hide',!p.radio);$('qt').classList.toggle('hide',!p.queue);$('nmw').classList.toggle('hide',!p.names);
if(V==='q'&&p.queue&&s.queue_ver!==qver)qload();
if(p.np){var ra=s.source==='radio';$('t').textContent=s.has_track?(ra&&s.stream_title?s.stream_title:s.title||s.station||'-'):'Nothing playing';$('a').textContent=ra?s.station:s.artist;$('al').textContent=ra?'':s.album;
$('by').innerHTML='';if(s.by_you)$('by').innerHTML=mark(1)+'Your song';else if(s.by)$('by').textContent='Queued by '+s.by;
if(s.art!==art){art=s.art;if(art)$('cv').src='api/cover?v='+encodeURIComponent(art);else $('cv').classList.add('hide')}
$('pw').classList.toggle('hide',ra||!s.has_track);$('pos').max=Math.max(1,s.duration_ms);$('pos').value=s.position_ms;$('pc').textContent=fm(s.position_ms);$('du').textContent=fm(s.duration_ms)}
else{$('t').textContent='The host keeps the song a secret';$('a').textContent='';$('al').textContent='';$('by').textContent='';$('cv').classList.add('hide');$('pw').classList.add('hide')}
$('sk').classList.toggle('hide',!p.skip);$('vw').classList.toggle('hide',!p.vol);if(p.vol&&!drag){$('vol').value=s.volume;$('vv').textContent=s.volume}
if(!s.controllable)say('The music is paused by the host')}).catch(function(){busy=0;say('Player not reachable')})}
function refresh(){poll()}
$('nx').onclick=function(){pc('next').then(function(j){if(j.ok)say('Skipped',1)})};
$('vol').oninput=function(){drag=1;$('vv').textContent=this.value};$('vol').onchange=function(){drag=0;pc('volume','value='+this.value)};
$('cv').onload=function(){$('cv').classList.remove('hide')};$('cv').onerror=function(){$('cv').classList.add('hide')};
/* adding: one song at a time, counted against your songs */
function qadd(o){pc('queue',enc({action:'add',kind:o.kind||'song',song_id:o.id||'',path:o.path||''})).then(function(j){if(j.ok)say('Queued at place '+j.place+(j.left?' - '+j.left+' more to add':''),1)})}
function song(s){return[s.title,s.artist+(s.album?' · '+s.album:''),function(){sheet(s.title+' · '+s.artist,[['Add to the queue',function(){qadd(s)}]])}]}
function frow(path){return function(x){var p=path?path+'/'+x.name:x.name;return[(x.dir?'\ud83d\udcc1 ':'')+x.name,'',x.dir?function(){open('folder',{path:p},x.name,frow(p))}:function(){sheet(x.name,[['Add to the queue',function(){qadd({kind:'file',path:p})}]])}]}}
function station(x){return[x.name,[x.codec,x.bitrate?x.bitrate+' kbps':'',x.country].filter(Boolean).join(' · '),function(){sheet(x.name,[['Play when the queue is empty',function(){pc('play_item',enc({kind:'radio_hit',pos:x.pos,url:x.url})).then(function(j){if(j.ok)say(x.name+' plays when the queue is empty',1)})}]])}]}
var ROOT={albums:['Albums',function(x){return[x.name,x.artist+' · '+x.count,function(){open('album',{name:x.name},x.name,song)}]}],
artists:['Artists',function(x){return[x.name,'',function(){open('artist',{name:x.name},x.name,song)}]}],songs:['Songs',song],
playlists:['Playlists',function(x){return[x.name,'',function(){open('playlist',{id:x.id},x.name,song)}]}],favorites:['Favourites',song],folder:['Folders',frow(''),{path:''}],radio:['Radio stations',station]};
function open(l,p,t,row){st.push({l:l,p:p,t:t,row:row});$('q').value='';load(0)}
function cur(){return st[st.length-1]}
function load(off){var v=cur(),p={};for(var k in v.p)p[k]=v.p[k];if($('q').value)p.q=$('q').value;p.offset=off;p.limit=100;
$('ti').textContent=v.t;$('bk').style.visibility=st.length>1?'visible':'hidden';if(!off){items=[];$('list').textContent='Loading…'}
$('q').placeholder=v.l==='radio_search'?'Search all stations':'Search';if(v.l==='radio_search'){rsearch(v);return}
get('api/library/'+v.l+'?'+enc(p)).then(function(j){if(v!==cur())return;if(!j.ok){$('list').textContent='';say(j.message||'Not possible right now');return}
if(!off)$('list').textContent='';tot=j.total;j.items.forEach(function(x){items.push(x);var r=v.row(x),b=document.createElement('button');b.className='r';
var t=document.createElement('b');t.textContent=r[0];b.appendChild(t);if(r[1]){var s=document.createElement('small');s.textContent=r[1];b.appendChild(s)}b.onclick=r[2];$('list').appendChild(b)});
if(!tot)$('list').textContent=$('q').value?'No matches':'Empty';$('mo').classList.toggle('hide',items.length>=tot)}).catch(function(){say('Player not reachable')})}
/* station search: the Disc asks the station directory (a few seconds), the page asks for the result */
function rsearch(v){var g=v.gen=(v.gen||0)+1;$('mo').classList.add('hide');$('list').textContent='Searching…';
pc('radio_search',enc({q:$('q').value})).then(function(j){if(j.ok)rpoll(v,g,0);else if(v===cur()&&g===v.gen)$('list').textContent=''})}
function rpoll(v,g,n){if(v!==cur()||g!==v.gen)return;get('api/library/radio_search?limit=100').then(function(j){if(v!==cur()||g!==v.gen)return;
if(j.ok&&j.search==='busy'){if(n<40)setTimeout(function(){rpoll(v,g,n+1)},750);else $('list').textContent='The station directory did not answer - try again';return}
if(j.ok&&j.search==='failed'){$('list').textContent='The station directory did not answer - try again';return}$('list').textContent='';(j.items||[]).forEach(function(x){var r=station(x),b=document.createElement('button');b.className='r';
var t=document.createElement('b');t.textContent=r[0];b.appendChild(t);var m=document.createElement('small');m.textContent=r[1];b.appendChild(m);b.onclick=r[2];$('list').appendChild(b)});if(!(j.items||[]).length)$('list').textContent='No stations found'}).catch(function(){say('Player not reachable')})}
/* the queue: what plays now and what guests (and the host) queued, in play order */
function qload(){get('api/queue').then(function(j){if(V!=='q')return;if(!j.ok){$('ql').textContent=j.message||'';return}qver=j.ver;var l=$('ql'),h=null;l.textContent='';
var H={cur:'Playing now',queue:'Queued'};j.items.forEach(function(x){if(H[x.k]!==h){h=H[x.k];var e=document.createElement('h3');e.className='qh';e.textContent=h;l.appendChild(e)}
var b=document.createElement('div');b.className='r';var t=document.createElement('b'),m=document.createElement('small');t.innerHTML=mark(x.mine);t.appendChild(document.createTextNode(x.hidden?'A secret song':x.t||'-'));
m.textContent=[x.a,x.d?fm(x.d):'',x.mine?'yours':x.by?'by '+x.by:''].filter(Boolean).join(' · ');b.appendChild(t);b.appendChild(m);l.appendChild(b)});
if(!j.items.length)l.textContent='Nothing queued yet - add a song!'}).catch(function(){say('Player not reachable')})}
function tab(v){V=v;[].forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.dataset.v===v)});
['np','qv','lib','me'].forEach(function(i){$(i).classList.add('hide')});$(v==='q'?'qv':ROOT[v]?'lib':v).classList.remove('hide');say('');
if(v==='q'){qver=-1;$('ql').textContent='Loading…';poll();return}if(v==='np'){poll();return}if(ROOT[v]){st=[];open(v==='radio'?'radio_search':v,ROOT[v][2]||{},ROOT[v][0],ROOT[v][1])}}
[].forEach.call($('tabs').children,function(b){b.onclick=function(){tab(b.dataset.v)}});
$('bk').onclick=function(){if(st.length>1){st.pop();$('q').value='';load(0)}};$('shb').onclick=shut;$('mo').onclick=function(){load(items.length)};
var qt;$('q').oninput=function(){clearTimeout(qt);qt=setTimeout(function(){load(0)},cur().l==='radio_search'?600:300)};
$('nm').value=NM;$('nm').onchange=function(){NM=$('nm').value.trim();while(new TextEncoder().encode(NM).length>24)NM=NM.slice(0,-1);$('nm').value=NM;try{localStorage.setItem('pn',NM)}catch(e){}poll();if(NM)say('Hi '+NM+'!',1)};
$('lka').value=LK.acc;$('lkf').value=LK.fav;$('lka').onchange=function(){LK.acc=$('lka').value;look()};$('lkf').onchange=function(){LK.fav=$('lkf').value;look();qver=-1};
setInterval(function(){if(V==='np'||V==='q')poll()},1000);document.addEventListener('visibilitychange',poll);poll();
</script></html>
