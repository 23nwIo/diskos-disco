# Test configuration for MPD 0.23.17 on the Disc (audio core test, 2026-11-15)
music_directory   "/tmp/sdcard"
state_file        "/tmp/mpd-test/state"
bind_to_address   "/tmp/mpd-test/sock"
log_file          "/tmp/mpd-test/log"
log_level         "verbose"
audio_output {
  type            "alsa"
  name            "dac"
  device          "hw:0,3"
  mixer_type      "none"
  auto_resample   "no"
  auto_format     "no"
}
